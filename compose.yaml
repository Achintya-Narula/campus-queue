services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusqueue}
      POSTGRES_USER: ${POSTGRES_USER:-campusqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusqueue}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campusqueue}
      DB_USERNAME: ${POSTGRES_USER:-campusqueue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campusqueue}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-byte-secret}
      JWT_TTL: ${JWT_TTL:-PT1H}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
